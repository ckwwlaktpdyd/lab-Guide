<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Preparation Guide — 작업 준비</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "surface":     "#E7E5E4",
          "surface-alt": "#EDEBEA",
          "raised":      "#E7E5E4",
          "primary":     "#006666",
          "primary-dark":"#004d4d",
          "accent":      "#c45e2c",
          "ink":         "#1E2938",
          "ink-soft":    "#57534e",
          "ink-muted":   "#a8a29e",
          "pass":        "#00A63D",
          "pass-bg":     "#dcfce7",
          "warn":        "#FE9900",
          "warn-bg":     "#fef3c7",
          "fail":        "#FF2157",
          "fail-bg":     "#fee2e2",
        },
        fontFamily: {
          "sans":  ["Inter", "Noto Sans KR", "Apple SD Gothic Neo", "sans-serif"],
          "title": ["Space Mono", "JetBrains Mono", "monospace"],
          "mono":  ["JetBrains Mono", "monospace"],
        },
        borderRadius: {"DEFAULT": "0.375rem", "lg": "10px", "xl": "14px", "2xl": "1rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { min-height: 100dvh; background: #E7E5E4; font-family: "Inter", "Noto Sans KR", sans-serif; color: #1E2938; -webkit-font-smoothing: antialiased; }
  .font-data { font-family: "JetBrains Mono", monospace; }
  .font-title { font-family: "Space Mono", "JetBrains Mono", monospace; }
  .neu-raised { background: #E7E5E4;  border-radius: 14px; box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff; }
  .neu-inset  { background: #E7E5E4;  border-radius: 10px; box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff; }
  .neu-btn    { background: #E7E5E4;  border-radius: 14px; box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff; transition: all 0.15s ease; }
    .neu-btn:hover {
    box-shadow:
      5px 5px 10px #bebebe,
      -5px -5px 10px #ffffff;
  }
  .neu-btn:active { box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff; }
  .neu-btn-primary { background: linear-gradient(135deg, #007a7a 0%, #005252 100%);  border-radius: 14px; box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff, inset 0 1px 0 rgba(255,255,255,0.15); color: white; transition: all 0.15s ease; }
    .neu-btn-primary:hover {
    box-shadow:
      5px 5px 10px #bebebe,
      -5px -5px 10px #ffffff;
    background: linear-gradient(135deg, #008a8a 0%, #006060 100%);
  }
  .neu-btn-primary:active { box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2), inset -3px -3px 6px rgba(255,255,255,0.05); }
  .scroll-hide::-webkit-scrollbar { display: none; }
  .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  body { min-height: 100dvh; }
  .scroll-hide::-webkit-scrollbar { display: none; }
  .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  
  /* Custom Checkbox styles */
  .checkbox-card { transition: all 0.2s ease; cursor: pointer; }
  .checkbox-card:hover { border-color: #00666680; background-color: #f8fafc; }
  .checkbox-card:has(input:checked) { 
    border-color: #006666; 
    background-color: rgba(236,91,19,0.04); 
    box-shadow: 0 4px 6px -1px rgba(236,91,19,0.1), 0 2px 4px -2px rgba(236,91,19,0.1);
  }
  .checkbox-card:has(input:checked) h3 { color: #006666; }
  
  input[type="checkbox"] { 
    appearance: none; background-color: #fff; margin: 0; 
    font: inherit; color: currentColor; width: 1.5em; height: 1.5em; 
    border: 2px solid #cbd5e1; border-radius: 0.35rem; 
    display: grid; place-content: center; transition: all 0.1s ease;
  }
  input[type="checkbox"]::before {
    content: ""; width: 0.8em; height: 0.8em;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    transform: scale(0); transition: 120ms transform ease-in-out;
  }
  input[type="checkbox"]:checked { background-color: #006666; border-color: #006666; }
  input[type="checkbox"]:checked::before { transform: scale(1); background-color: #fff; }

  /* P0: Respect reduced-motion preference (WCAG / ui-ux-pro-max critical) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body class="bg-surface flex justify-center">
<div class="w-full max-w-[768px] flex flex-col bg-surface-alt shadow-xl" style="height:100dvh">

  <!-- ══ Header ══ -->
  <header class="shrink-0 pt-3 pb-2 px-3 bg-surface-alt z-10 sticky top-0">
    <div class="flex items-center">
      <a href="manufacturer_home.html"
         class="flex size-11 shrink-0 items-center justify-center rounded-full hover:bg-surface-alt transition-colors text-ink focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40"
         aria-label="안전 가이드 종료 및 홈으로 돌아가기">
        <span class="material-symbols-outlined text-[26px]">arrow_back</span>
      </a>
    </div>
  </header>

  <!-- ══ Content Area ══ -->
  <div class="flex-1 overflow-y-auto scroll-hide px-5 pb-8 flex flex-col">
    
    <!-- Title Section -->
    <div class="mb-8 pt-2">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-red-100 text-red-600 font-bold text-[11px] uppercase tracking-widest rounded-lg mb-3">
        <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
        ASAP · 긴급 의뢰
      </div>
      <h1 class="text-3xl font-bold text-ink tracking-tight leading-tight mb-2">10x PBS Buffer<br/>Preparation</h1>
      <p class="text-[15px] font-medium text-ink-soft leading-relaxed">
        작업 시작 전, 메뉴얼(SOP)에 따른 도구 체크와 시약 무결성을 먼저 확인해 주세요.
      </p>
    </div>

    <!-- Required Tools (Read-only list) -->
    <div class="mb-8">
      <h2 class="text-[13px] font-bold text-ink-muted uppercase tracking-wider mb-3 ml-1">필수 준비 장비</h2>
      
      <!-- List wrapper: flex-col instead of flex-row splits -->
      <div class="flex flex-col gap-3">
        
        <div class="flex items-center gap-4 neu-raised rounded-xl p-4 relative overflow-hidden">
          <div class="absolute top-0 left-0 h-full w-1.5 bg-surface"></div>
          <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-orange-50 text-orange-600 shrink-0">
            <span class="material-symbols-outlined text-2xl">science</span>
          </div>
          <div class="flex-1">
            <h3 class="text-base font-bold text-ink leading-tight">대용량 비커 (Beaker)</h3>
            <p class="text-[13px] text-ink-soft mt-0.5">최소 2L 용량 (교반용)</p>
          </div>
        </div>
        
        <div class="flex items-center gap-4 neu-raised rounded-xl p-4 relative overflow-hidden">
          <div class="absolute top-0 left-0 h-full w-1.5 bg-surface"></div>
          <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-blue-50 text-blue-600 shrink-0">
            <span class="material-symbols-outlined text-2xl">water_bottle</span>
          </div>
          <div class="flex-1">
            <h3 class="text-base font-bold text-ink leading-tight">시약 보관병 (Bottle)</h3>
            <p class="text-[13px] text-ink-soft mt-0.5">광차단 보관 용기</p>
          </div>
        </div>

        <div class="flex items-center gap-4 neu-raised rounded-xl p-4 relative overflow-hidden">
           <div class="absolute top-0 left-0 h-full w-1.5 bg-surface"></div>
           <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 shrink-0">
             <span class="material-symbols-outlined text-2xl">device_thermostat</span>
           </div>
           <div class="flex-1">
             <h3 class="text-base font-bold text-ink leading-tight">pH 캘리브레이션 미터</h3>
             <p class="text-[13px] text-ink-soft mt-0.5">온도 보정(ATC) 센서 필수</p>
           </div>
         </div>
      </div>
    </div>

    <!-- Reagents Checklist (Requires interaction) -->
    <div class="mb-6">
      <div class="flex items-end justify-between mb-3 ml-1 pr-1">
        <h2 class="text-[13px] font-bold text-ink-muted uppercase tracking-wider">시약 체크리스트</h2>
        <span class="text-[11px] font-bold text-primary bg-primary/15 px-2 py-0.5 rounded">필수</span>
      </div>
      
      <div class="flex flex-col gap-3">
        <!-- Checklist 1 -->
        <label class="checkbox-card flex items-center justify-between neu-raised border-2 border-stone-300/30 rounded-xl p-4">
          <div class="flex flex-col">
            <h3 class="text-[17px] font-bold text-ink leading-tight transition-colors">NaCl (염화나트륨)</h3>
            <p class="text-sm font-medium text-ink-soft mt-0.5">타겟 용량: 400g / 실온(RT)</p>
          </div>
          <input type="checkbox" aria-label="NaCl 시약 준비 완료" />
        </label>
        
        <!-- Checklist 2 -->
        <label class="checkbox-card flex items-center justify-between neu-raised border-2 border-stone-300/30 rounded-xl p-4">
          <div class="flex flex-col">
            <h3 class="text-[17px] font-bold text-ink leading-tight transition-colors">KCl (염화칼륨)</h3>
            <p class="text-sm font-medium text-ink-soft mt-0.5">타겟 용량: 10g / 냉장(2-8°C)</p>
          </div>
          <input type="checkbox" aria-label="KCl 시약 준비 완료" />
        </label>
        
        <!-- Checklist 3 -->
        <label class="checkbox-card flex items-center justify-between neu-raised border-2 border-stone-300/30 rounded-xl p-4">
          <div class="flex flex-col">
            <h3 class="text-[17px] font-bold text-ink leading-tight transition-colors">증류수 (dH₂O)</h3>
            <p class="text-sm font-medium text-ink-soft mt-0.5">최대 용량: Up to 1L</p>
          </div>
          <input type="checkbox" aria-label="증류수 준비 완료" />
        </label>
      </div>
    </div>
    
  </div><!-- end content-area -->

  <!-- ══ Footer Actions ══ -->
  <footer class="shrink-0 p-5 neu-raised shadow-[0_-4px_15px_rgba(0,0,0,0.02)]">
    <button onclick="checkPrepAndGo()"
       class="flex items-center justify-center rounded-xl h-14 w-full px-8 bg-primary hover:bg-primary/90 active:bg-primary/80 active:scale-[0.99] text-white text-lg font-bold transition-all focus-visible:outline-none focus-visible:ring-4 focus:ring-primary/30">
      <span class="material-symbols-outlined mr-2 text-[22px]">play_arrow</span>
      <span>제조 시퀀스 시작 (Start)</span>
    </button>
  </footer>

</div><!-- end shell -->

<script>
  function checkPrepAndGo() {
    const totalChecks = document.querySelectorAll('input[type="checkbox"]').length;
    const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
    
    if (totalChecks > 0 && totalChecks !== checked) {
      // Use standard prototype UX wrapper for alert
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-red-600 text-white text-sm font-bold w-max max-w-[90vw] px-5 py-3.5 rounded-xl shadow-2xl z-50 transform translateY(100vh) animate-[modal-panel-in_0.3s_ease-out_both] flex items-center gap-2';
      toast.innerHTML = '<span class="material-symbols-outlined text-xl">gpp_maybe</span> 모든 시약 체크를 완료해 주세요.';
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px) translateX(-50%)';
        setTimeout(() => toast.remove(), 200);
      }, 2500);
    } else {
      window.location.href = 'active_workflow.html';
    }
  }
</script>
</body>
</html>
