<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lab-Guide — 장비 선택 및 버퍼 예약</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "surface":     "#E7E5E4",
          "surface-alt": "#EDEBEA",
          "raised":      "#E7E5E4",
          "primary":     "#006666",
          "primary-dark":"#004d4d",
          "accent":      "#c45e2c",
          "ink":         "#1E2938",
          "ink-soft":    "#57534e",
          "ink-muted":   "#a8a29e",
          "pass":        "#00A63D",
          "pass-bg":     "#dcfce7",
          "warn":        "#FE9900",
          "warn-bg":     "#fef3c7",
          "fail":        "#FF2157",
          "fail-bg":     "#fee2e2",
        },
        fontFamily: {
          "sans":  ["Inter", "Noto Sans KR", "Apple SD Gothic Neo", "sans-serif"],
          "title": ["Space Mono", "JetBrains Mono", "monospace"],
          "mono":  ["JetBrains Mono", "monospace"],
        },
        borderRadius: {"DEFAULT": "0.375rem", "lg": "10px", "xl": "14px", "2xl": "1rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { min-height: 100dvh; background: #E7E5E4; font-family: "Inter", "Noto Sans KR", sans-serif; color: #1E2938; -webkit-font-smoothing: antialiased; }
  .font-data { font-family: "JetBrains Mono", monospace; }
  .font-title { font-family: "Space Mono", "JetBrains Mono", monospace; }
  .neu-raised { background: #E7E5E4;  border-radius: 14px; box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff; }
  .neu-inset  { background: #E7E5E4;  border-radius: 10px; box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff; }
  .neu-btn    { background: #E7E5E4;  border-radius: 14px; box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff; transition: all 0.15s ease; }
    .neu-btn:hover {
    box-shadow:
      5px 5px 10px #bebebe,
      -5px -5px 10px #ffffff;
  }
  .neu-btn:active { box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff; }
  .neu-btn-primary { background: linear-gradient(135deg, #007a7a 0%, #005252 100%);  border-radius: 14px; box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff, inset 0 1px 0 rgba(255,255,255,0.15); color: white; transition: all 0.15s ease; }
    .neu-btn-primary:hover {
    box-shadow:
      5px 5px 10px #bebebe,
      -5px -5px 10px #ffffff;
    background: linear-gradient(135deg, #008a8a 0%, #006060 100%);
  }
  .neu-btn-primary:active { box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2), inset -3px -3px 6px rgba(255,255,255,0.05); }
  .scroll-hide::-webkit-scrollbar { display: none; }
  .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  body { min-height: 100dvh; }
  .scroll-hide::-webkit-scrollbar { display: none; }
  .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .equip-card.selected { border-color: #006666; background: rgba(236,91,19,0.05); }
  .equip-card.selected .equip-check { background: #006666; color: white; }

  /* P0: Respect reduced-motion preference (WCAG / ui-ux-pro-max critical) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body class="bg-surface flex justify-center">
<div class="w-full max-w-[768px] flex flex-col bg-surface" style="height:100dvh">

  <!-- ── Header ── -->
  <header class="shrink-0 flex items-center px-3 py-3 gap-3">
    <a href="client_schedule.html" class="flex items-center justify-center w-11 h-11 rounded-full hover:neu-inset text-ink-muted transition-colors shrink-0" aria-label="돌아가기">
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </a>
    <div class="flex-1 min-w-0">
      <p class="text-[11px] text-ink-muted font-medium uppercase tracking-widest leading-none">10x PBS Buffer · B-1042</p>
      <p class="text-lg font-bold text-ink leading-tight">장비 선택 및 버퍼 예약</p>
    </div>
    <span class="shrink-0 text-[11px] font-bold text-amber-600 bg-amber-100 rounded-full px-2.5 py-1">수정가능</span>
  </header>

  <!-- ── Scrollable content ── -->
  <div class="flex-1 overflow-y-auto scroll-hide min-h-0">

    <!-- Equipment selection -->
    <div class="px-4 pt-4 pb-2">
      <p class="text-[11px] text-ink-muted font-bold uppercase tracking-wider mb-3 flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">build</span>
        장비 목록 — 필요한 장비를 선택하세요
      </p>

      <div class="flex flex-col gap-2" id="equipment-list">

        <!-- Equipment 1 -->
        <button class="equip-card selected flex items-center gap-3 rounded-xl p-3 bg-primary/5 transition-all text-left w-full" onclick="toggleEquip(this)">
          <div class="equip-check flex items-center justify-center w-8 h-8 rounded-lg bg-primary text-white shrink-0 transition-colors">
            <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">check</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm text-ink leading-tight">전자저울 (ME-204)</p>
            <p class="text-xs text-ink-soft mt-0.5">정밀도: ±0.1mg · 클린룸 A-3</p>
          </div>
          <span class="text-[10px] font-bold text-green-600 bg-green-100 rounded px-2 py-0.5 shrink-0">사용 가능</span>
        </button>

        <!-- Equipment 2 -->
        <button class="equip-card selected flex items-center gap-3 rounded-xl p-3 bg-primary/5 transition-all text-left w-full" onclick="toggleEquip(this)">
          <div class="equip-check flex items-center justify-center w-8 h-8 rounded-lg bg-primary text-white shrink-0 transition-colors">
            <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">check</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm text-ink leading-tight">피펫 (Eppendorf Research Plus)</p>
            <p class="text-xs text-ink-soft mt-0.5">범위: 100–1000 μL · 클린룸 A-3</p>
          </div>
          <span class="text-[10px] font-bold text-green-600 bg-green-100 rounded px-2 py-0.5 shrink-0">사용 가능</span>
        </button>

        <!-- Equipment 3 -->
        <button class="equip-card flex items-center gap-3 rounded-xl border-2 border-stone-300/30 p-3 transition-all text-left w-full" onclick="toggleEquip(this)">
          <div class="equip-check flex items-center justify-center w-8 h-8 rounded-lg neu-inset text-ink-muted shrink-0 transition-colors">
            <span class="material-symbols-outlined text-base">check</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm text-ink leading-tight">교반기 (IKA RCT Basic)</p>
            <p class="text-xs text-ink-soft mt-0.5">RPM: 0–1500 · 클린룸 A-4</p>
          </div>
          <span class="text-[10px] font-bold text-green-600 bg-green-100 rounded px-2 py-0.5 shrink-0">사용 가능</span>
        </button>

        <!-- Equipment 4: 사용 중 -->
        <button class="equip-card flex items-center gap-3 rounded-xl border-2 border-stone-300/30 p-3 opacity-50 cursor-not-allowed text-left w-full" disabled>
          <div class="equip-check flex items-center justify-center w-8 h-8 rounded-lg neu-inset text-ink-muted shrink-0">
            <span class="material-symbols-outlined text-base">block</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm text-ink-soft leading-tight">pH 미터 (Mettler Toledo)</p>
            <p class="text-xs text-ink-muted mt-0.5">클린룸 A-3 · 사용자: 박수진</p>
          </div>
          <span class="text-[10px] font-bold text-amber-600 bg-amber-100 rounded px-2 py-0.5 shrink-0">사용 중</span>
        </button>

        <!-- Equipment 5: 점검 중 -->
        <button class="equip-card flex items-center gap-3 rounded-xl border-2 border-stone-300/30 p-3 opacity-50 cursor-not-allowed text-left w-full" disabled>
          <div class="equip-check flex items-center justify-center w-8 h-8 rounded-lg neu-inset text-ink-muted shrink-0">
            <span class="material-symbols-outlined text-base">block</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm text-ink-soft leading-tight">버퍼 제조 라인 B</p>
            <p class="text-xs text-ink-muted mt-0.5">정기 점검 예정: 4/1 ~ 4/3</p>
          </div>
          <span class="text-[10px] font-bold text-red-500 bg-red-100 rounded px-2 py-0.5 shrink-0">점검 중</span>
        </button>

      </div>
    </div>

    <!-- Divider -->
    <div class="h-2 bg-surface-alt my-2"></div>

    <!-- Buffer reservation form -->
    <div class="px-4 pt-4 pb-6">
      <p class="text-[11px] text-ink-muted font-bold uppercase tracking-wider mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">edit_note</span>
        버퍼 예약 상세
      </p>

      <form class="flex flex-col gap-4" onsubmit="event.preventDefault()">

        <!-- Buffer type -->
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-ink">버퍼 종류</label>
          <select class="w-full rounded-xl neu-raised px-4 py-3 text-sm text-ink font-medium focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40 focus:border-primary transition-colors">
            <option selected>10x PBS Buffer</option>
            <option>TAE Buffer</option>
            <option>Tris-HCl (pH 8.0)</option>
            <option>HEPES Buffer</option>
            <option>MOPS Buffer</option>
          </select>
        </div>

        <!-- Volume -->
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-ink">목표 용량</label>
          <div class="flex items-center gap-2">
            <input type="number" value="5" min="0.1" step="0.1" class="flex-1 rounded-xl neu-raised px-4 py-3 text-sm text-ink font-medium focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40 focus:border-primary transition-colors"/>
            <select class="w-20 rounded-xl neu-raised px-3 py-3 text-sm text-ink font-medium focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40 focus:border-primary transition-colors">
              <option selected>L</option>
              <option>mL</option>
            </select>
          </div>
        </div>

        <!-- Date & Time -->
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-ink">예약 날짜</label>
            <input type="date" value="2026-03-30" class="rounded-xl neu-raised px-4 py-3 text-sm text-ink font-medium focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40 focus:border-primary transition-colors"/>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-ink">시작 시간</label>
            <input type="time" value="10:00" class="rounded-xl neu-raised px-4 py-3 text-sm text-ink font-medium focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40 focus:border-primary transition-colors"/>
          </div>
        </div>

        <!-- Manufacturing Line -->
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-ink">제조 라인</label>
          <select class="w-full rounded-xl neu-raised px-4 py-3 text-sm text-ink font-medium focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40 focus:border-primary transition-colors">
            <option selected>버퍼 제조 라인 A (클린룸 A-3)</option>
            <option disabled>버퍼 제조 라인 B (점검 중)</option>
          </select>
        </div>

        <!-- Notes -->
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-ink">메모 <span class="text-ink-muted font-normal">(선택)</span></label>
          <textarea rows="3" placeholder="특이사항이나 추가 요청을 입력하세요..." class="w-full rounded-xl neu-raised px-4 py-3 text-sm text-ink placeholder-ink-muted focus-visible:outline-none focus-visible:ring-2 focus:ring-primary/40 focus:border-primary transition-colors resize-none"></textarea>
        </div>

      </form>
    </div>

  </div><!-- end scroll -->

  <!-- ── Bottom action bar ── -->
  <div class="shrink-0 flex items-center gap-3 px-4 py-3 bg-surface">
    <button class="flex-1 flex items-center justify-center gap-2 py-3.5 rounded-xl border-2 border-stone-300/30 text-ink font-bold text-base hover:bg-surface-alt transition-colors">
      <span class="material-symbols-outlined text-xl">close</span>
      취소
    </button>
    <button class="flex-[2] flex items-center justify-center gap-2 py-3.5 rounded-xl bg-primary text-white font-bold text-base hover:bg-primary/90 transition-colors">
      <span class="material-symbols-outlined text-xl" style="font-variation-settings:'FILL' 1">event_available</span>
      예약 확정
    </button>
  </div>

</div>

<script>
function toggleEquip(el) {
  if (el.disabled) return;
  el.classList.toggle('selected');
}
</script>
</body>
</html>
